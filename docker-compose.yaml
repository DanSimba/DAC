services:

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres-cliente:
    image: postgres:16
    environment:
      POSTGRES_DB: cliente
      POSTGRES_USER: monster
      POSTGRES_PASSWORD: monster
    ports:
      - "5433:5432"
  
  postgres-conta:
    image: postgres:16
    environment:
      POSTGRES_DB: conta
      POSTGRES_USER: monster
      POSTGRES_PASSWORD: monster
    ports:
      - "5434:5432"

  postgres-gerente:
    image: postgres:16
    environment:
      POSTGRES_DB: gerente
      POSTGRES_USER: monster
      POSTGRES_PASSWORD: monster
    ports:
      - "5435:5432"

  ms-cliente:
    build:
      context: ./backend/ms-cliente
      dockerfile: ms-cliente.dockerfile

    depends_on:
      - postgres-cliente
      - rabbitmq

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-cliente:5432/cliente
      SPRING_DATASOURCE_USERNAME: monster
      SPRING_DATASOURCE_PASSWORD: monster

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

    ports:
      - "8081:8080"

  front-end:
    build: ./frontend
    ports:
      - "4200:4200"
    networks:
      - monsterbank-net

  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"
    networks:
      - monsterbank-net

  ms-gerente:
    build: ./backend/ms-gerente
    ports:
      - "8084:8084"
    depends_on:
      - db-gerente
    networks:
      - monsterbank-net

  rabbitmq:
    image: rabbitmq:3.7.8-management
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - monsterbank-net
  
  db-auth:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-auth
      - POSTGRES_USER=ms-auth
      - POSTGRES_PASSWORD=psql
    ports:
      - "5433:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    networks:
      - monsterbank-net

  db-conta:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-conta
      - POSTGRES_USER=ms-conta
      - POSTGRES_PASSWORD=psql
    ports:
      - "5434:5432"
    volumes:
      - pgdata-conta:/var/lib/postgresql/data
    networks:
      - monsterbank-net

  db-cliente:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-cliente
      - POSTGRES_USER=ms-cliente
      - POSTGRES_PASSWORD=psql
    ports:
      - "5435:5432"
    volumes:
      - pgdata-cliente:/var/lib/postgresql/data
    networks:
      - monsterbank-net

  db-gerente:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-gerente
      - POSTGRES_USER=ms-gerente
      - POSTGRES_PASSWORD=psql
    ports:
      - "5436:5432"
    volumes:
      - pgdata-gerente:/var/lib/postgresql/data
    networks:
      - monsterbank-net

volumes:
  pgdata-gerente:
  pgdata-auth:
  pgdata-cliente:
  pgdata-conta:

networks:
  monsterbank-net:
    driver: bridge
