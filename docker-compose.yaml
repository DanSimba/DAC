services:
  front-end:
    build: ./frontend
    ports: 
      - 4200:4200
  api-gateway:
    build: ./backend/api-gateway
    ports:
      - 8080:8080
    env_file:
      - ./backend/api-gateway/.env
    depends_on:
      - ms-cliente
    
  ms-cliente:
    build: ./backend/ms-cliente
    ports: 
    - 8081:8081