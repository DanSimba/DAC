services:

  #=====INFRAESTUTURA=====#
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - monsterbank-net

  rabbitmq:
    image: rabbitmq:3.7.8-management
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck: # testando verificação do rabbitmq antes de subir o api-gateway
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - monsterbank-net

  #=====BANCO DE DADOS=====#
  db-auth:
    image: mongo:7
    environment:
      - MONGO_INITDB_DATABASE=ms-auth
      - MONGO_INITDB_ROOT_USERNAME=ms-auth
      - MONGO_INITDB_ROOT_PASSWORD=psql
    ports:
      - "27017:27017"
    volumes:
      - mgdata-auth:/data/db
    networks:
      - monsterbank-net

  db-account:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-account
      - POSTGRES_USER=ms-account
      - POSTGRES_PASSWORD=psql
    ports:
      - "5434:5432"
    volumes:
      - pgdata-conta:/var/lib/postgresql/data
    networks:
      - monsterbank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms-account -d ms-account"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M 

  #db-account-write:
  #image: postgres:15-alpine
  #  environment:
  #    - POSTGRES_DB=ms-account
  #    - POSTGRES_USER=ms-account
  #    - POSTGRES_PASSWORD=psql
  #  ports:
  #    - "5434:5432"
  #  volumes:
  #    - pgdata-conta:/var/lib/postgresql/data
  #  networks:
  #    - monsterbank-net
  #  deploy:
  #    resources:
  #      limits:
  #        memory: 384M 
  db-account-read:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-account-read
      - POSTGRES_USER=ms-account
      - POSTGRES_PASSWORD=psql
    ports:
      - "5437:5432"
    volumes:
      - pgdata-conta-read:/var/lib/postgresql/data
    networks:
      - monsterbank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms-account -d ms-account-read"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M 

  db-cliente:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-cliente
      - POSTGRES_USER=ms-cliente
      - POSTGRES_PASSWORD=psql
    ports:
      - "5435:5432"
    volumes:
      - pgdata-cliente:/var/lib/postgresql/data
    networks:
      - monsterbank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms-cliente -d ms-cliente"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-gerente:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-gerente
      - POSTGRES_USER=ms-gerente
      - POSTGRES_PASSWORD=psql
    ports:
      - "5436:5432"
    volumes:
      - pgdata-gerente:/var/lib/postgresql/data
    networks:
      - monsterbank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms-gerente -d ms-gerente"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  #=====SERVIÇOS=====#
  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      MS_AUTH_URL: http://ms-auth:8081
      MS_ACCOUNT_URL: http://ms-account:8080
      MS_CLIENTE_URL: http://ms-cliente:8083
      MS_GERENTE_URL: http://ms-gerente:8084
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-MONSTERBANK}
      FRONTEND_URL: http://localhost:4200
      PORT: 8080
    depends_on: # testando verificação do rabbitmq antes de subir o api-gateway
      ms-auth:
        condition: service_started
      ms-account:
        condition: service_started
      ms-gerente:
        condition: service_started
      ms-cliente:
        condition: service_started
      seed-cliente:
        condition: service_completed_successfully
      seed-account:
        condition: service_completed_successfully
      seed-auth:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      ms-orquestrador:
        condition: service_started
      # - ms-gerente
      # - ms-cliente
      # - redis
      # - rabbitmq
    networks:
      - monsterbank-net


  ms-auth:
    build:
      context: ./backend/ms-auth

    depends_on:
      - db-auth
      - rabbitmq

    mem_limit: 512m
    mem_reservation: 384m

    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      SPRING_MONGODB_URI: mongodb://ms-auth:psql@db-auth:27017/ms-auth?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

    ports:
      - "8081:8081"

    networks:
      - monsterbank-net

  seed-auth:
    image: mongo:7
    depends_on:
      db-auth:
        condition: service_started
    volumes:
      - ./backend/ms-auth/database/seed.js:/seed.js:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mongosh --quiet "mongodb://ms-auth:psql@db-auth:27017/ms-auth?authSource=admin" --eval "db.adminCommand('ping').ok" | grep -q 1; do sleep 2; done
        mongosh --quiet "mongodb://ms-auth:psql@db-auth:27017/ms-auth?authSource=admin" /seed.js
    networks:
      - monsterbank-net


  ms-cliente:
    build:
      context: ./backend/ms-cliente
      #dockerfile: ms-cliente.dockerfile
    mem_limit: 512m
    mem_reservation: 384m

    depends_on:
      db-cliente:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-cliente:5432/ms-cliente
      SPRING_DATASOURCE_USERNAME: ms-cliente
      SPRING_DATASOURCE_PASSWORD: psql

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

    ports:
      - "8083:8083"

    networks:
      - monsterbank-net

  ms-orquestrador:
    build: ./backend/ms-orquestrador
    
    mem_limit: 512m
    mem_reservation: 384m
    
    depends_on:
      - rabbitmq
      - redis
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - monsterbank-net

  ms-account:
    build:
      context: ./backend/ms-account
      dockerfile: ms-account.dockerfile
    depends_on:
      db-account:
        condition: service_healthy
      db-account-read:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-account:5432/ms-account
      SPRING_DATASOURCE_USERNAME: ms-account
      SPRING_DATASOURCE_PASSWORD: psql
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8082:8080"
    networks:
    - monsterbank-net
    deploy:
      resources:
        limits:
          memory: 512M 

  seed-cliente:
    image: postgres:15-alpine
    depends_on:
      ms-cliente:
        condition: service_started
    environment:
      PGPASSWORD: psql
    volumes:
      - ./backend/ms-cliente/database/seed.sql:/seed.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until psql -h db-cliente -U ms-cliente -d ms-cliente -tAc "SELECT to_regclass('public.clientes')" | grep -q clientes; do sleep 2; done
        psql -v ON_ERROR_STOP=1 -h db-cliente -U ms-cliente -d ms-cliente -f /seed.sql
    networks:
      - monsterbank-net

  seed-account:
    image: postgres:15-alpine
    depends_on:
      ms-account:
        condition: service_started
    environment:
      PGPASSWORD: psql
    volumes:
      - ./backend/ms-account/database/seed.sql:/seed.sql:ro
      - ./backend/ms-account/database/seedread.sql:/seedread.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until psql -h db-account -U ms-account -d ms-account -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('account', 'extrato', 'operation', 'transference', 'eventos')" | grep -q '^5$'; do sleep 2; done
        until psql -h db-account-read -U ms-account -d ms-account-read -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('account', 'eventos')" | grep -q '^2$'; do sleep 2; done
        psql -v ON_ERROR_STOP=1 -h db-account -U ms-account -d ms-account -f /seed.sql
        psql -v ON_ERROR_STOP=1 -h db-account-read -U ms-account -d ms-account-read -f /seedread.sql
    networks:
      - monsterbank-net

  ms-email:
    build:
      context: ./backend/ms-email
      
    mem_limit: 512m
    mem_reservation: 384m
    
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
    networks:
      - monsterbank-net

  front-end:
    build: ./frontend
    ports:
      - "4200:4200"
    networks:
      - monsterbank-net

  #api-gateway:
   # build: ./backend/api-gateway
   # ports:
   #   - "8080:8080"
   # networks:
   #   - monsterbank-net

  ms-gerente:
    build: ./backend/ms-gerente

    mem_limit: 512m
    mem_reservation: 384m

    ports:
      - "8084:8084"
    depends_on:
      db-gerente:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC  
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-gerente:5432/ms-gerente
      - SPRING_DATASOURCE_USERNAME=ms-gerente
      - SPRING_DATASOURCE_PASSWORD=psql
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    networks:
      - monsterbank-net

  #=====FRONT END=====#

  #front-end:
  #  build: ./frontend
  #  ports:
  #    - "4200:4200"
  #  networks:
  #    - monsterbank-net

#=====INFRA DOCKER=====#

volumes:
  pgdata-gerente:
  mgdata-auth:
  pgdata-cliente:
  pgdata-conta:
  pgdata-conta-read:

networks:
  monsterbank-net:
    driver: bridge
