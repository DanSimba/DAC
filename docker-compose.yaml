services:
  front-end:
    build: ./frontend
    ports: 
      - "4200:4200"

  api-gateway:
    build: ./backend/api-gateway
    ports:
      - "8080:8080"

  ms-gerente:
    build: ./backend/ms-gerente 
    ports:
      - "8084:8084" 
    depends_on:
      - db-gerente 
  
  rabbitmq:
    image: rabbitmq:3.7.8-management
    ports:
      - 5672:5672
      - 15672:15672

  db-gerente:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-gerente
      - POSTGRES_USER=ms-gerente
      - POSTGRES_PASSWORD=psql
    ports:
      - "5432:5432"
    volumes:
      - pgdata-gerente:/var/lib/postgresql/data
  
  db-conta:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-conta
      - POSTGRES_USER=ms-conta
      - POSTGRES_PASSWORD=psql
    ports:
      - "5432:5432"
    volumes:
      - pgdata-contax :/var/lib/postgresql/data 
  
  db-cliente:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-cliente
      - POSTGRES_USER=ms-cliente
      - POSTGRES_PASSWORD=psql
    ports:
      - "5432:5432"
    volumes:
      - pgdata-cliente:/var/lib/postgresql/data 

  db-auth:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ms-auth
      - POSTGRES_USER=ms-auth
      - POSTGRES_PASSWORD=psql
    ports:
      - "5432:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql/data 

volumes:
  pgdata-gerente:
  pgdata-auth:
  pgdata-cliente:
  pgdata-conta: