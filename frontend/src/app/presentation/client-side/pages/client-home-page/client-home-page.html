<div class="flex flex-row w-screen h-[80vh] px-[2vw] py-[2vh] gap-x-2 justify-between items-center pb-4">

    <!--LOGO CHAVOSA-->
    <div class="flex w-[36vw] h-full bg-logo bg-cover">

    </div>

    <!--LINHA-->
    <div class="w-1 h-[64vh] rounded-full bg-white">
    </div>

    <!--HOME DE FATO-->
    <div class="flex flex-col w-[56vw] h-[64vh] gap-y-10 justify-start">
        <h1 class="font-monster text-7xl text-white">Bem vindo, {{client().name}}</h1>

        <div class="flex flex-row gap-x-2 justify-start">
            <span class="group flex flex-row w-fit hover:justify-between items-center gap-2 p-2 text-xl font-display font-title text-black bg-amber-200 rounded-xl transition-all duration-150">
                <p class="whitespace-nowrap">Saldo:</p> <p class="hidden group-hover:flex whitespace-nowrap opacity-0 group-hover:opacity-100 transition-all duration-180">{{account().balance}}R$</p>
            </span>
            <span class="group flex flex-row w-fit hover:justify-between items-center gap-2 p-2 text-xl font-display font-title text-black bg-azure rounded-xl transition-all duration-150">
                Conta: {{account().number}}
            </span>
        </div>
        

        <div class="grid grid-cols-2 w-[35vw] h-[24vh] gap-y-5 justify-center">

            <div class="flex flex-row w-[15vw] h-[8vh] justify-center items-center rounded-xl bg-rosa text-2xl font-title text-black font-display transition-all duration-130 hover:scale-105 hover:shadow-[6px_6px_0px_var(--color-azure)] hover:cursor-pointer">
                Sacar
            </div> 

            <div class="flex flex-row w-[15vw] h-[8vh] justify-center items-center rounded-xl bg-rosa text-2xl font-title text-black font-display transition-all duration-130 hover:scale-105 hover:shadow-[6px_6px_0px_var(--color-azure)] hover:cursor-pointer">
                Depositar
            </div> 

            <div class="flex flex-row w-[15vw] h-[8vh] justify-center items-center rounded-xl bg-rosa text-2xl font-title text-black font-display transition-all duration-130 hover:scale-105 hover:shadow-[6px_6px_0px_var(--color-azure)] hover:cursor-pointer">
                Transferir
            </div> 

            <div class="flex flex-row w-[15vw] h-[8vh] justify-center items-center rounded-xl bg-rosa text-2xl font-title text-black font-display transition-all duration-130 hover:scale-105 hover:shadow-[6px_6px_0px_var(--color-azure)] hover:cursor-pointer">
                Consultar Extrato
            </div> 
        </div>
        
    </div>
</div>
