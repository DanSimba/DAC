<div class="mx-auto max-w-md p-6 shadow-lg border rounded-lg my-12">
  
  <h2 class="text-2xl font-bold">Acesse o BANTADS</h2>
  <p class="text-sm text-gray-600 mb-6">Entre com seu e-mail e senha para acessar sua conta.</p>

  @if (mensagemSucesso) {
    <div class="p-3 bg-green-100 border rounded border-green-400 text-green-700 mb-4">
      {{ mensagemSucesso }}
    </div>
  }

  @if (mensagemErro) {
    <div class="p-3 bg-red-100 border rounded border-red-400 text-red-700 mb-4">
      {{ mensagemErro }}
    </div>
  }

  <form (ngSubmit)="onSubmit()">
    
    <div class="mb-4">
      <label class="text-sm font-medium">E-mail *</label>
      <input 
        type="email" 
        name="email" 
        [(ngModel)]="email" 
        class="w-full border border-gray-400 rounded p-2"
        placeholder="cliente@email.com.br"
      />
    </div>
  
    <div class="mb-6">
      <label class="text-sm font-medium">Senha *</label>
      <div class="relative mt-1">
        <input 
          [type]="mostrarSenha ? 'text' : 'password'" 
          name="password" 
          [(ngModel)]="password" 
          class="w-full border border-gray-400 rounded p-2"
          placeholder="••••••••••"
        />
  
        <button 
          type="button" 
          (click)="alternarMostrarSenha()" 
          class="absolute inset-y-0 right-3 text-xs text-gray-600 hover:text-black">
          {{ mostrarSenha ? 'Ocultar' : 'Ver' }}
        </button>
  
      </div>
    </div>
  
    <button 
      type="submit" 
      class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-800">
      Entrar
    </button>
  
    <div class="mt-6 text-center text-sm text-gray-600 border-t pt-4">
      Não possui uma conta? 
      <a routerLink="/autocadastro" class="text-blue-600 font-semibold hover:underline">
        Ir para autocadastro
      </a>
    </div>
  
  </form>
</div>
