<div class="flex flex-col w-screen max-w-full min-h-screen py-4 justify-center items-center gap-y-4 bg-linear-to-t from-azure to-marinho to-35% overflow-x-hidden">

  <h1 class="text-5xl text-white font-monster">ACESSE O BANTADS</h1>

  @if (mensagemSucesso) {
    <div class="w-[85vw] max-w-md p-3 bg-green-900/30 border border-green-500/50 text-green-400 font-display rounded text-center font-bold">
      {{ mensagemSucesso }}
    </div>
  }

  @if (mensagemErro) {
    <div class="w-[85vw] max-w-md p-3 bg-red-900/30 border border-red-500/50 text-red-400 font-display rounded text-center font-bold">
      {{ mensagemErro }}
    </div>
  }

  <div class="w-[85vw] max-w-md p-8 rounded-lg bg-black/50 border border-white/10 text-white font-display shadow-lg">
    
    <p class="text-sm text-white/60 mb-6">
      Entre com seu e-mail e senha para acessar sua conta.
    </p>

    <form (ngSubmit)="onSubmit()">
      
      <div class="mb-4">
        <label class="block text-sm font-bold mb-1">E-mail *</label>
        <input 
          type="email" 
          name="email" 
          [(ngModel)]="credentials.login" 
          class="w-full bg-black/50 border border-white/20 rounded-lg p-2.5 text-white placeholder-white/40 focus:outline-none focus:border-pink-500"
          placeholder="cliente@email.com.br"
        />
      </div>
    
      <div class="mb-6">
        <label class="block text-sm font-bold mb-1">Senha *</label>
        <div class="relative">
          <input 
            [type]="mostrarSenha ? 'text' : 'password'" 
            name="password" 
            [(ngModel)]="credentials.senha" 
            class="w-full bg-black/50 border border-white/20 rounded-lg p-2.5 pr-16 text-white placeholder-white/40 focus:outline-none focus:border-pink-500"
            placeholder="••••••••••"
          />
    
          <button 
            type="button" 
            (click)="alternarMostrarSenha()" 
            class="absolute inset-y-0 right-3 text-xs font-bold text-azure hover:text-white cursor-pointer">
            {{ mostrarSenha ? 'Ocultar' : 'Ver' }}
          </button>
        </div>
      </div>
    
      <button 
        type="submit" 
        class="w-full bg-rosa hover:opacity-90 text-white font-title text-lg font-bold py-2.5 rounded-lg transition-all cursor-pointer">
        Entrar
      </button>
    
      <div class="mt-6 text-center text-sm text-white/60 border-t border-white/10 pt-4">
        Não possui uma conta? 
        <a routerLink="/autocadastro" class="text-azure font-bold hover:underline ml-1">
          Ir para autocadastro
        </a>
      </div>
    
    </form>
  </div>

</div>
