<div class="mx-auto max-w-2xl p-6 shadow-lg border rounded-lg my-12">
  
  <h2 class="text-2xl font-bold">Solicitação de Autocadastro - BANTADS</h2>
  <p class="text-sm text-gray-600 mb-6">Preencha seus dados para solicitar a abertura de conta.</p>

  @if (mensagemSucesso) {
    <div class="p-3 bg-green-100 border rounded border-green-400 text-green-700 mb-4">
      {{ mensagemSucesso }}
    </div>
  }

  @if (mensagemErro) {
    <div class="p-3 bg-red-100 border rounded border-red-400 text-red-700 mb-4">
      {{ mensagemErro }}
    </div>
  }

  <form (ngSubmit)="onSubmit()">
    
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-4"> 
      <div class="md:col-span-8">
        <label class="text-sm font-medium">Nome Completo *</label> 
        <input 
          type="text" 
          name="nome" 
          [(ngModel)]="nome" 
          class="w-full border border-gray-400 rounded p-2"
          placeholder="Ex: João Banana Coitadinho da Silva"
        />
      </div>

      <div class="md:col-span-4">
        <label class="text-sm font-medium">CPF *</label>
        <input 
          type="text" 
          name="cpf" 
          [(ngModel)]="cpf"
          (keydown)="bloquearNaoNumeros($event)"
          (input)="formatarCPF()"
          maxlength="14"
          class="w-full border border-gray-400 rounded p-2"
          placeholder="000.000.000-00"
        />
      </div>
    </div>

    <div class="grid grid-cols-3 gap-4 mb-4">
      <div>
        <label class="text-sm font-medium">E-mail *</label>
        <input 
          type="email" 
          name="email" 
          [(ngModel)]="email" 
          class="w-full border border-gray-400 rounded p-2"
          placeholder="cliente@email.com"
        />
      </div>

      <div>
        <label class="text-sm font-medium">Telefone</label>
        <input 
          type="text" 
          name="telefone" 
          [(ngModel)]="telefone"
          (keydown)="bloquearNaoNumeros($event)"
          (input)="formatarTelefone()"
          maxlength="15"
          class="w-full border border-gray-400 rounded p-2"
          placeholder="(99) 99999-9999"
        />
      </div>

      <div>
        <label class="text-sm font-medium">Salário (R$) *</label>
        <input 
          type="text" 
          name="salario" 
          [(ngModel)]="salarioExibicao"
          (keydown)="bloquearNaoNumeros($event)"
          (input)="formatarSalario()" 
          class="w-full border border-gray-400 rounded p-2"
          placeholder="R$ 2500.00"
        />
      </div>
    </div>

    <h3 class="text-lg font-bold mt-6 mb-3 border-b pb-1">Endereço</h3>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-4">
      <div class="md:col-span-3">
        <label class="text-sm font-medium">CEP</label>
        <input 
          type="text" 
          name="cep" 
          [(ngModel)]="address.cep" 
          (input)="verifyCep(address.cep)"
          mask="00000-000"
          class="w-full border border-gray-400 rounded p-2"
          placeholder="80000-000"
        />
      </div>

      <div class="md:col-span-7">
        <label class="text-sm font-medium">Rua</label>
        <input 
          type="text" 
          name="logradouro" 
          [(ngModel)]="address.street"
          [readonly]="ruaBloqueada"
          [class.bg-gray-300]="ruaBloqueada"
          [class.cursor-not-allowed]="ruaBloqueada" 
          class="w-full border border-gray-400 rounded p-2"
          placeholder="Rua / Avenida..."
        />
      </div>

      <div class="md:col-span-2">
        <label class="text-sm font-medium">Número</label>
        <input 
          type="text" 
          name="numero" 
          [(ngModel)]="address.number" 
          class="w-full border border-gray-400 rounded p-2"
          placeholder="123"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-6">
      <div class="md:col-span-3">
        <label class="text-sm font-medium">Complemento</label>
        <input 
          type="text" 
          name="complemento" 
          [(ngModel)]="address.complement" 
          class="w-full border border-gray-400 rounded p-2"
          placeholder="Apto 101"
        />
      </div>

      <div class="md:col-span-4">
        <label class="text-sm font-medium">Bairro</label>
        <input 
          type="text"
          name="bairro"
          [(ngModel)]="address.neighborhood"
          readonly
          class="w-full border border-gray-400 rounded p-2 bg-gray-300 cursor-not-allowed"
          placeholder="Jardim das Américas"
        />
      </div>

      <div class="md:col-span-5">
        <label class="text-sm font-medium">Cidade / UF</label>
        <div class="flex gap-2">
          <input 
            type="text" 
            name="cidade" 
            [(ngModel)]="address.city" 
            readonly
            class="w-3/4 border border-gray-400 rounded p-2 bg-gray-300 cursor-not-allowed"
            placeholder="Curitiba"
          />
          <input 
            type="text" 
            name="uf" 
            [(ngModel)]="address.uf" 
            readonly
            class="w-1/4 border border-gray-400 rounded p-2 bg-gray-300 cursor-not-allowed"
            placeholder="PR"
          />
        </div>
      </div>
    </div>

    <button 
      type="submit" 
      class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-800">
      Enviar Solicitação
    </button>

  </form>
</div>
