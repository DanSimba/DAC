spring.application.name=ms-account

server.port=8080

# WRITE DATABASE
app.datasource.write.url=jdbc:postgresql://db-account:5432/ms-account
app.datasource.write.username=ms-account
app.datasource.write.password=psql
app.datasource.write.driver-class-name=org.postgresql.Driver

# READ DATABASE
app.datasource.read.url=jdbc:postgresql://db-account-read:5432/ms-account-read
app.datasource.read.username=ms-account
app.datasource.read.password=psql
app.datasource.read.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false