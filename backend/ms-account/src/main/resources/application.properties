spring.application.name=ms-account
server.port=8080

#DB-ACCOUNT <-user e senha ja estão no docker compose, mas é melhor deixar explicito aq pra n ter erro
spring.datasource.url=jdbc:postgresql://db-account:5432/ms-account
spring.datasource.username=ms-account 
spring.datasource.password=psql

#DB-ACCOUNT-READ
app.datasource.read.url=jdbc:postgresql://db-account-read:5432/ms-account-read
app.datasource.read.username=ms-account
app.datasource.read.password=psql
app.datasource.read.driver-class-name=org.postgresql.Driver

#jpa
spring.jpa.open-in-view=false   
spring.jpa.hibernate.ddl-auto=update